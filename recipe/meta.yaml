{% set name = "phreeqcrm" %}
{% set version = "0.0.20" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/phreeqcrm-{{ version }}.tar.gz
  sha256: 4d165c23c8e1c7223d7d74b82fd1a812431da4ab28ffbd6d4481cd868f9c8623

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 1
  skip: true  # [py<311]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake >=3.20,<4
    - make
    - ninja
    - swig
  host:
    - python
    - scikit-build-core
    - numpy
    - pip
  run:
    - numpy
    - python
    - pyyaml
    - _openmp_mutex  # [linux]
    - llvm-openmp    # [osx]
    - vcomp14        # [win]

test:
  imports:
    - phreeqcrm
  commands:
    - pytest swig/python
  requires:
    - pytest
  source_files:
    - swig/python/advect.pqi
    - swig/python/conftest.py
    - swig/python/constants.py
    - swig/python/minimum.yaml
    - swig/python/phreeqc.dat
    - swig/python/test_basic.py
    - swig/python/test_callbacks.py
    - swig/python/test_functions.py
    - swig/python/test_get_value.py
    - swig/python/test_init.py
    - swig/python/test_irf.py
    - swig/python/test_set_value.py
    - swig/python/WriteYamlFile.py

about:
  home: https://github.com/usgs-coupled/phreeqcrm
  summary: A reaction module for transport simulators based on the geochemical model PHREEQC.
  license: BSD-3-Clause AND LicenseRef-USGS-Public-Domain
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dlparkhurst
    - scharlton2
